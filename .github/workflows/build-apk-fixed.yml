name: Crear APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android
        uses: android-actions/setup-android@v4

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10'

      - name: Descomprimir proyecto
        run: |
          mkdir -p proyecto/ComparadorPreciosAndroid
       - name: Descomprimir proyecto
        run: |
          rm -rf proyecto
          mkdir proyecto
          unzip -q ComparadorPreciosAndroid-JVM17.zip -d proyecto
          find proyecto -name settings.gradle.kts -print

        - name: Activar AndroidX
        run: |
          DIR=$(dirname "$(find proyecto -name settings.gradle.kts -print -quit)")
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          cd "$DIR"
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m" >> gradle.properties
          cat gradle.propertie

      - name: Crear APK
        run: |
          cd "$DIR"
          gradle assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: ComparadorPrecios-APK
          path: proyecto/**/app/build/outputs/apk/debug/app-debug.apk
