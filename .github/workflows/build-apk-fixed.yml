name: Crear APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android
        uses: android-actions/setup-android@v4

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10'

      - name: Descomprimir proyecto
        run: |
          rm -rf proyecto
          mkdir -p proyecto
          unzip -q ComparadorPreciosAndroid-V6.1.zip -d proyecto
          echo "Proyecto descomprimido:"
          find proyecto -name settings.gradle.kts -print

      - name: Activar AndroidX
        run: |
          DIR=$(dirname "$(find proyecto -name settings.gradle.kts -print -quit)")
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          cd "$DIR"
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m" >> gradle.properties

      - name: Preparar firma estable
        env:
          KEYSTORE_BASE64: ${{ secrets.COMPARADOR_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/comparador-release.jks"
          echo "COMPARADOR_KEYSTORE_PATH=$RUNNER_TEMP/comparador-release.jks" >> "$GITHUB_ENV"

      - name: Crear APK
        env:
          COMPARADOR_STORE_PASSWORD: ${{ secrets.COMPARADOR_KEYSTORE_PASSWORD }}
          COMPARADOR_KEY_ALIAS: ${{ secrets.COMPARADOR_KEY_ALIAS }}
          COMPARADOR_KEY_PASSWORD: ${{ secrets.COMPARADOR_KEY_PASSWORD }}
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: ComparadorPrecios-APK
          path: proyecto/**/app/build/outputs/apk/debug/app-debug.apk
